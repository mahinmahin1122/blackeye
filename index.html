<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackeye</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    font-family: Arial, "Segoe UI", sans-serif;
    color: #202124;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 40px;
  }
  .icon {
    width: 52px;
    height: 52px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 400;
    margin: 0 0 16px 0;
    color: #202124;
  }
  .sub {
    font-size: 14px;
    line-height: 1.6;
    color: #202124;
    margin-bottom: 20px;
  }
  .sub b { font-weight: bold; }
  .try-label {
    font-size: 13px;
    color: #202124;
    margin-bottom: 6px;
  }
  ul {
    margin: 0 0 20px 0;
    padding-left: 20px;
    font-size: 13px;
    line-height: 1.9;
  }
  ul li a {
    color: #1a73e8;
    text-decoration: none;
  }
  ul li a:hover {
    text-decoration: underline;
  }
  .error-code {
    font-size: 12px;
    color: #5f6368;
    margin-bottom: 28px;
  }
  button {
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 9px 24px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover {
    background: #1765cc;
  }
  .details-btn {
    float: right;
    background: #fff;
    color: #202124;
    border: 1px solid #dadce0;
    border-radius: 20px;
    padding: 9px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .details-btn:hover {
    background: #f8f9fa;
  }
  .row { display: flex; justify-content: space-between; align-items: center; max-width: 600px; }
</style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15s1-1.5 3-1.5 3 1.5 3 1.5" stroke-linecap="round"/></svg>
    <h1>This site can&rsquo;t be reached</h1>
    <div class="sub"><b id="domain">sdasdasdas.com</b> took too long to respond.</div>
    <div class="try-label">Try:</div>
    <ul>
      <li>Checking the connection</li>
      <li><a href="#">Checking the proxy and the firewall</a></li>
      <li><a href="#">Running Windows Network Diagnostics</a></li>
    </ul>
    <div class="error-code">ERR_TIMED_OUT</div>
    <div class="row">
      <button onclick="location.reload()">Reload</button>
      <button class="details-btn" onclick="alert('This site is unreachable.\nERR_TIMED_OUT')">Details</button>
    </div>
  </div>

  <script>
    // Optional: change the domain shown via ?url=example.com in the address bar
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');
    if (url) {
      document.getElementById('domain').textContent = url;
      document.title = url;
    }
  </script>
</body>
</html>
